<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>study-engine</title>
<style>
  :root {
    --bg: #E7E9F0; --bar: #FFFFFF; --ink: #161927; --sub: #5B6175; --line: #E2E5EE;
    --pri: #4F46E5; --pri-soft: #ECEBFD; --danger: #E5484D; --ok: #30A46C;
    --bar-h: 52px; --sub-h: 0px;
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  body.dark { --bg: #0E1016; --bar: #171A23; --ink: #ECEEF5; --sub: #A3A9BC; --line: #2A2F3C; --pri: #8B85FF; --pri-soft: #25233F; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  button { font-family: inherit; }

  /* ── 상단 도구 막대 ── */
  #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 60; background: var(--bar); border-bottom: 1px solid var(--line); padding-top: var(--safe-top); }
  .row { display: flex; align-items: center; gap: 2px; padding: 6px 6px; overflow-x: auto; scrollbar-width: none; }
  .row::-webkit-scrollbar { display: none; }
  #subbar { display: none; border-top: 1px solid var(--line); }
  #subbar.show { display: flex; }
  .btn { flex: none; height: 38px; min-width: 38px; border: 0; background: transparent; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px; color: var(--ink);
    font-size: 13px; font-weight: 700; padding: 0 8px; cursor: pointer; }
  .btn:active { background: var(--line); }
  .btn.on { background: var(--pri-soft); color: var(--pri); }
  .btn.red.on { background: #FDECEC; color: var(--danger); }
  .btn[disabled] { opacity: .35; }
  .btn svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn .lbl { font-size: 12px; }
  .sep { flex: none; width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
  .sw { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--bar); box-shadow: 0 0 0 1px var(--line); margin: 0 3px; cursor: pointer; }
  .sw.on { box-shadow: 0 0 0 2.5px var(--ink); }
  .wd { flex: none; width: 30px; height: 30px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .wd.on { background: var(--pri-soft); }
  .wd i { display: block; border-radius: 99px; background: var(--ink); }
  #title { flex: none; font-weight: 800; font-size: 14px; max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 6px; }
  .range { flex: none; width: 90px; accent-color: var(--pri); }
  .pill { flex: none; font-size: 12px; font-weight: 700; color: var(--sub); padding: 0 6px; white-space: nowrap; }

  /* ── 보기 영역 ── */
  #vp { position: fixed; left: 0; right: 0; bottom: 0; top: calc(var(--bar-h) + var(--sub-h)); overflow: auto; -webkit-overflow-scrolling: touch; }
  #content { position: relative; padding: 14px 0 160px; margin: 0 auto; }
  .page { position: relative; margin: 0 auto 14px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(20,24,40,.08); overflow: hidden; }
  .surf { touch-action: none; }
  .page canvas, .surf > canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .page .pdf { z-index: 0; }
  .page .bgtpl { position: absolute; inset: 0; z-index: 0; }
  .page .ink, .surf .ink { z-index: 3; pointer-events: none; mix-blend-mode: multiply; }
  .page .overlay { z-index: 4; pointer-events: none; opacity: .45; mix-blend-mode: multiply; }
  .page .pnum { position: absolute; right: 8px; bottom: 6px; font-size: 10px; color: #9AA0B2; z-index: 5; pointer-events: none; }
  #live { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 6; pointer-events: none; }

  /* pdf.js 텍스트 레이어 (선택 → 카드) */
  .textLayer { position: absolute; inset: 0; overflow: clip; opacity: 1; line-height: 1; text-align: initial; z-index: 2;
    -webkit-text-size-adjust: none; text-size-adjust: none; forced-color-adjust: none; transform-origin: 0 0; pointer-events: none;
    --user-unit: 1; --total-scale-factor: calc(var(--scale-factor) * var(--user-unit)); --scale-round-x: 1px; --scale-round-y: 1px;
    --min-font-size: 1; --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size)); --min-font-size-inv: calc(1 / var(--min-font-size)); }
  .textLayer :is(span, br) { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
  .textLayer > :not(.markedContent), .textLayer .markedContent span:not(.markedContent) { z-index: 1; --font-height: 0;
    font-size: calc(var(--text-scale-factor) * var(--font-height)); --scale-x: 1; --rotate: 0deg;
    transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv)); }
  .textLayer .markedContent { display: contents; }
  .textLayer ::selection { background: rgba(79,70,229,.32); }
  body.select .textLayer { pointer-events: auto; -webkit-user-select: text; user-select: text; }
  body.select .textLayer span { -webkit-user-select: text; user-select: text; }
  body.select .surf { touch-action: pan-x pan-y; }

  /* 빈 노트 배경 */
  .tpl-lined { background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--u) * 34 - 1px), #D6DCEB calc(var(--u) * 34 - 1px), #D6DCEB calc(var(--u) * 34)); background-position: 0 calc(var(--u) * 60); }
  .tpl-grid { background-image: linear-gradient(#E3E7F1 1px, transparent 1px), linear-gradient(90deg, #E3E7F1 1px, transparent 1px); background-size: calc(var(--u) * 28) calc(var(--u) * 28); }
  .tpl-dot { background-image: radial-gradient(#C5CBDA calc(var(--u) * 1.6), transparent calc(var(--u) * 1.8)); background-size: calc(var(--u) * 28) calc(var(--u) * 28); }

  /* 스포트라이트 */
  #spot { position: absolute; z-index: 30; display: none; border-radius: 6px; pointer-events: none;
    box-shadow: 0 0 0 5000px rgba(10,12,22,var(--dim, .74)); outline: 2px solid rgba(255,214,0,.9); }
  #spot.show { display: block; }
  body.spot #spot { pointer-events: auto; cursor: move; }
  #spot .grip { position: absolute; right: -10px; bottom: -10px; width: 24px; height: 24px; border-radius: 50%; background: #FFD600; border: 3px solid #fff; }
  #spotCtl { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + var(--safe-bottom)); z-index: 70; display: none;
    background: rgba(20,22,32,.92); border-radius: 16px; padding: 4px; gap: 2px; align-items: center; }
  #spotCtl.show { display: flex; }
  #spotCtl .btn { color: #fff; }
  #spotCtl .btn:active { background: rgba(255,255,255,.15); }
  #spotCtl .btn.on { background: #FFD600; color: #111; }
  #spotCtl input { width: 70px; accent-color: #FFD600; }

  /* 영역 캡처 */
  #capRect { position: fixed; z-index: 65; border: 2px dashed var(--pri); background: rgba(79,70,229,.12); display: none; pointer-events: none; border-radius: 4px; }

  /* 선택 팝업 */
  #selPop { position: fixed; z-index: 80; display: none; background: #1B1F2E; border-radius: 12px; padding: 4px; gap: 2px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  #selPop.show { display: flex; }
  #selPop .btn { color: #fff; height: 34px; }

  #pageInd { position: fixed; right: 12px; bottom: calc(14px + var(--safe-bottom)); z-index: 55; background: rgba(20,22,32,.72); color: #fff; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 10px; pointer-events: none; }
  #toast { position: fixed; left: 50%; bottom: calc(70px + var(--safe-bottom)); transform: translateX(-50%) translateY(20px); z-index: 90; background: #1B1F2E; color: #fff; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 12px; opacity: 0; transition: all .2s; pointer-events: none; max-width: 86vw; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #loading { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-weight: 700; color: var(--sub); }
  #loading .bar { width: 180px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0; background: var(--pri); transition: width .15s; }

  /* 모달 */
  #modal { position: fixed; inset: 0; z-index: 95; background: rgba(8,10,20,.5); display: none; align-items: center; justify-content: center; padding: 20px; }
  #modal.show { display: flex; }
  #modal .box { background: var(--bar); color: var(--ink); border-radius: 22px; padding: 20px; width: 100%; max-width: 400px; }
  #modal h3 { margin: 0 0 6px; font-size: 18px; }
  #modal p { margin: 0 0 14px; color: var(--sub); font-size: 14px; line-height: 1.5; }
  #modal .big { font-size: 44px; font-weight: 900; text-align: center; color: var(--pri); }
  #modal input[type=range] { width: 100%; accent-color: var(--pri); }
  #modal .acts { display: flex; gap: 8px; margin-top: 14px; }
  #modal .acts button { flex: 1; height: 46px; border: 0; border-radius: 14px; font-weight: 800; font-size: 15px; background: var(--line); color: var(--ink); }
  #modal .acts button.pri { background: var(--pri); color: #fff; }
  #modal .quick { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
  #modal .quick button { border: 0; background: var(--pri-soft); color: var(--pri); border-radius: 10px; padding: 6px 10px; font-weight: 800; }

  /* ── 코넬 노트 ── */
  .cornell { position: relative; margin: 0 auto; background: #fff; color: #161927; box-shadow: 0 4px 16px rgba(20,24,40,.08); border-radius: 4px; }
  .c-head { display: flex; align-items: flex-end; gap: 10px; padding: 18px 18px 10px; border-bottom: 2px solid #161927; }
  .c-title { flex: 1; font-size: 22px; font-weight: 900; outline: none; min-height: 28px; -webkit-user-select: text; user-select: text; }
  .c-title:empty:before { content: '제목'; color: #B5BAC9; }
  .c-date { font-size: 12px; color: #8A90A2; }
  .c-labels { display: flex; font-size: 11px; font-weight: 800; color: #8A90A2; border-bottom: 1px solid #E2E5EE; }
  .c-labels div { padding: 6px 10px; }
  .crow { display: flex; border-bottom: 1px solid #E2E5EE; position: relative; }
  .cue { width: 28%; flex: none; border-right: 2px solid #F0B4B4; padding: 10px; font-weight: 800; font-size: 15px; color: #3E63DD; outline: none; word-break: keep-all; -webkit-user-select: text; user-select: text; }
  .cue:empty:before { content: '키워드·질문'; color: #C5CBDA; font-weight: 600; }
  body.study .cue { cursor: pointer; -webkit-user-select: none; user-select: none; }
  body.study .cue:active { background: #EEF0FF; }
  .cnote { flex: 1; position: relative; display: flex; flex-direction: column; }
  .ntext { padding: 10px 10px 4px; font-size: 14px; line-height: 1.55; outline: none; -webkit-user-select: text; user-select: text; min-height: 24px; }
  .ntext:empty:before { content: '타이핑으로 적거나 아래에 손글씨로 적으세요'; color: #C5CBDA; }
  .inkarea { position: relative; }
  .rgrip { position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); width: 46px; height: 14px; z-index: 8; touch-action: none; display: flex; align-items: center; justify-content: center; cursor: ns-resize; }
  .rgrip i { width: 30px; height: 4px; border-radius: 2px; background: #D3D8E5; }
  .blind { position: absolute; inset: 0; z-index: 9; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 6px;
    background: repeating-linear-gradient(45deg, #2A2F45, #2A2F45 10px, #30364F 10px, #30364F 20px); color: #fff; font-weight: 800; font-size: 14px; cursor: pointer; }
  .crow.blinded .blind { display: flex; }
  .blind small { font-weight: 600; opacity: .7; font-size: 12px; }
  .rtools { position: absolute; left: 4px; bottom: 4px; display: flex; gap: 2px; z-index: 7; }
  .rtools button { border: 0; background: #F2F4F9; color: #5B6175; border-radius: 8px; height: 26px; min-width: 26px; font-size: 12px; font-weight: 700; padding: 0 6px; }
  .judge { display: none; position: absolute; right: 6px; top: 6px; z-index: 10; gap: 4px; }
  .crow.judging .judge { display: flex; }
  .judge button { border: 0; border-radius: 10px; height: 32px; padding: 0 10px; font-weight: 800; color: #fff; }
  .score { position: absolute; left: 6px; top: 4px; font-size: 10px; color: #9AA0B2; pointer-events: none; }
  .c-add { display: block; width: calc(100% - 20px); margin: 10px; height: 40px; border: 1.5px dashed #C5CBDA; border-radius: 12px; background: transparent; color: #5B6175; font-weight: 800; }
  .c-sum { border-top: 2px solid #161927; padding: 12px 12px 20px; }
  .c-sum h4 { margin: 0 0 8px; font-size: 13px; color: #8A90A2; display: flex; align-items: center; gap: 8px; }
  .c-sum h4 button { border: 0; background: #F2F4F9; border-radius: 8px; padding: 4px 8px; font-weight: 700; font-size: 11px; color: #5B6175; }
  .mm-scroll { overflow-x: auto; padding-bottom: 6px; }
  .mm-node { display: flex; align-items: center; }
  .mm-box { flex: none; display: flex; align-items: center; gap: 2px; border: 2px solid var(--c, #3E63DD); background: #fff; border-radius: 12px; padding: 4px 6px; margin: 4px 0; max-width: 240px; }
  .mm-node.root > .mm-box { background: var(--c, #3E63DD); color: #fff; }
  .mm-text { outline: none; font-size: 13px; font-weight: 700; min-width: 40px; -webkit-user-select: text; user-select: text; word-break: keep-all; }
  .mm-text:empty:before { content: '내용'; color: #C5CBDA; }
  .mm-box button { border: 0; background: transparent; color: inherit; opacity: .55; font-weight: 900; font-size: 14px; width: 22px; height: 22px; padding: 0; }
  .mm-children { display: flex; flex-direction: column; justify-content: center; position: relative; padding-left: 22px; }
  .mm-children > .mm-node { position: relative; }
  .mm-children > .mm-node:before { content: ''; position: absolute; left: -11px; top: 50%; width: 11px; border-top: 2px solid var(--c, #3E63DD); }
  .mm-children > .mm-node:after { content: ''; position: absolute; left: -11px; top: 0; bottom: 0; border-left: 2px solid var(--c, #3E63DD); }
  .mm-children > .mm-node:first-child:after { top: 50%; }
  .mm-children > .mm-node:last-child:after { bottom: 50%; }
  .mm-children > .mm-node:only-child:after { display: none; }
  .mm-node > .mm-box:after { content: ''; }
  .mm-node.has-kids:not(.collapsed) > .mm-box { margin-right: 11px; position: relative; }
  .mm-node.has-kids:not(.collapsed) > .mm-box:after { position: absolute; right: -13px; top: 50%; width: 11px; border-top: 2px solid var(--c, #3E63DD); }
  .mm-node.collapsed > .mm-children { display: none; }
</style>
</head>
<body>
<div id="bar">
  <div class="row" id="mainbar"></div>
  <div class="row" id="subbar"></div>
</div>
<div id="vp"><div id="content"><div id="spot"><div class="grip"></div></div></div></div>
<div id="capRect"></div>
<div id="spotCtl"></div>
<div id="selPop"></div>
<div id="pageInd" style="display:none"></div>
<div id="toast"></div>
<div id="modal"><div class="box"></div></div>
<div id="loading"><div id="loadingText">불러오는 중…</div><div class="bar"><i id="loadingBar"></i></div></div>

<script>

    card: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
    pencilOnly: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/><circle cx="19" cy="19" r="3"/>',
    up: '<path d="m18 15-6-6-6 6"/>', down: '<path d="m6 9 6 6 6-6"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>',

  /* ═════════════════ 텍스트 선택 → 카드 / 형광펜 ═════════════════ */
  var selPop = $('#selPop');
  function hideSelPop() { selPop.classList.remove('show'); }
  document.addEventListener('selectionchange', debounce(function () {
    if (S.tool !== 'select') return;
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.toString().trim()) { hideSelPop(); return; }
    var node = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
    if (!node || !node.closest('.textLayer')) { hideSelPop(); return; }
    var r = sel.getRangeAt(0).getBoundingClientRect();
    selPop.innerHTML = '';
    selPop.appendChild(btn('card', '카드 만들기', false, function () {
      var s = surfAt(node);
      post({ type: 'createCard', text: sel.toString().replace(/\s+\n/g, '\n').trim(), page: s ? s.num : null });
      sel.removeAllRanges(); hideSelPop();
    }));
    selPop.appendChild(btn('hl', '형광펜', false, function () { highlightSelection(sel); sel.removeAllRanges(); hideSelPop(); }));
    selPop.classList.add('show');
    var pw = selPop.offsetWidth || 220;
    selPop.style.left = clamp(r.left + r.width / 2 - pw / 2, 8, window.innerWidth - pw - 8) + 'px';
    selPop.style.top = Math.max(($('#bar').offsetHeight || 50) + 6, r.top - 50) + 'px';
  }, 250));

  function highlightSelection(sel) {
    var rects = sel.getRangeAt(0).getClientRects();
    var bySurf = {};
    Array.prototype.forEach.call(rects, function (r) {
      if (r.width < 2) return;
      var s = surfAt(document.elementFromPoint(r.left + 1, r.top + r.height / 2)); if (!s) return;
      var sr = s.el.getBoundingClientRect(), k = 1000 / sr.width, y = (r.top + r.height / 2 - sr.top) * k;
      var st = { t: 'hl', c: S.hl, w: r.height * k * 0.95, p: [(r.left - sr.left) * k, y, 0.5, (r.right - sr.left) * k, y, 0.5] };
      s.strokes.push(st); (bySurf[s.key] = bySurf[s.key] || []).push(st);
      pushUndo({ type: 'add', key: s.key, stroke: st });
    });
    Object.keys(bySurf).forEach(function (k) { redrawInk(S.surfs[k]); markDirty(k); });
  }

  /* ═════════════════ 코넬 노트 ═════════════════ */
  var saveCornell = debounce(function () { post({ type: 'saveDoc', patch: { content: cornellData() } }); }, 700);
  function cornellData() {
    var c = S.cornell;
    return {
      title: $('.c-title') ? $('.c-title').innerText.trim() : c.title,
      rows: c.rows.map(function (r) { return { id: r.id, cue: r.cue, text: r.text, h: r.h, ok: r.ok || 0, ng: r.ng || 0 }; }),
      summary: c.summary
    };
  }
  function buildCornell(data, ink) {
    var c = S.cornell = {
      title: data && data.title || S.title || '', rows: (data && data.rows && data.rows.length ? data.rows : [{ id: uid(), cue: '', text: '', h: 260 }, { id: uid(), cue: '', text: '', h: 260 }, { id: uid(), cue: '', text: '', h: 260 }]),
      summary: data && data.summary || { id: 'root', text: S.title || '핵심 요약', children: [], collapsed: false }
    };
    var wrap = el('div', 'cornell');
    var head = el('div', 'c-head');
    var title = el('div', 'c-title'); title.contentEditable = 'true'; title.innerText = c.title || '';
    title.addEventListener('input', saveCornell);
    head.appendChild(title);
    var d = new Date(); head.appendChild(el('div', 'c-date', d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate()));
    wrap.appendChild(head);
    wrap.appendChild(el('div', 'c-labels', '<div style="width:28%">키워드 · 질문</div><div>필기</div>'));
    var rowsBox = el('div', 'c-rows'); wrap.appendChild(rowsBox);
    var addBtn = el('button', 'c-add', '＋ 행 추가'); addBtn.onclick = function () { addRow(); }; wrap.appendChild(addBtn);
    var sum = el('div', 'c-sum');
    sum.innerHTML = '<h4>요약 · 마인드맵 <button data-a="open">모두 펼치기</button><button data-a="close">모두 접기</button></h4><div class="mm-scroll"></div>';
    sum.querySelector('[data-a=open]').onclick = function () { walk(c.summary, function (n) { n.collapsed = false; }); renderMM(); saveCornell(); };
    sum.querySelector('[data-a=close]').onclick = function () { walk(c.summary, function (n) { if (n.id !== 'root') n.collapsed = true; }); renderMM(); saveCornell(); };
    wrap.appendChild(sum);
    content.insertBefore(wrap, spotEl);
    c.rows.forEach(function (r) { rowsBox.appendChild(rowEl(r, ink['r_' + r.id])); });
    layout();
    renderMM();
  }
  function rowEl(r, inkData) {
    var row = el('div', 'crow'); row.dataset.id = r.id;
    var cue = el('div', 'cue'); cue.contentEditable = S.study ? 'false' : 'true'; cue.innerText = r.cue || '';
    cue.addEventListener('input', function () { r.cue = cue.innerText.trim(); saveCornell(); });
    cue.addEventListener('click', function () { if (S.study) toggleBlind(row, r); });
    var note = el('div', 'cnote');
    var nt = el('div', 'ntext'); nt.contentEditable = 'true'; nt.innerText = r.text || '';
    nt.addEventListener('input', function () { r.text = nt.innerText.trim(); saveCornell(); });
    var area = el('div', 'inkarea');
    var s = makeSurf('r_' + r.id, area, (r.h || 260) / 1000, 'cell', inkData);
    s.row = r;
    var blind = el('div', 'blind', '🙈 가려짐<small>키워드를 보고 떠올린 뒤 탭해서 확인</small>');
    blind.addEventListener('click', function () { toggleBlind(row, r); });
    var grip = el('div', 'rgrip', '<i></i>');
    gripResize(grip, s, r);
    var judge = el('div', 'judge');
    var ok = el('button', '', '✓ 맞음'); ok.style.background = '#30A46C';
    var ng = el('button', '', '✗ 틀림'); ng.style.background = '#E5484D';
    ok.onclick = function () { r.ok = (r.ok || 0) + 1; row.classList.remove('judging'); updScore(); saveCornell(); };
    ng.onclick = function () { r.ng = (r.ng || 0) + 1; row.classList.remove('judging'); updScore(); saveCornell(); };
    judge.appendChild(ok); judge.appendChild(ng);
    var score = el('div', 'score');
    function updScore() { score.textContent = (r.ok || r.ng) ? '✓' + (r.ok || 0) + ' ✗' + (r.ng || 0) : ''; }
    updScore();
    var tools = el('div', 'rtools');
    var eye = el('button', '', '👁'); eye.onclick = function () { toggleBlind(row, r); };
    var cardB = el('button', '', '카드'); cardB.onclick = function () { exportRow(r); };
    var del = el('button', '', '삭제'); del.onclick = function () { deleteRow(r, row); };
    tools.appendChild(eye); tools.appendChild(cardB); tools.appendChild(del);
    note.appendChild(nt); note.appendChild(area); note.appendChild(blind); note.appendChild(judge);
    row.appendChild(cue); row.appendChild(note); row.appendChild(tools); row.appendChild(score);
    area.appendChild(grip);
    io.observe(area);
    if (S.study) row.classList.add('blinded');
    return row;
  }
  function gripResize(grip, s, r) {
    var st = null;
    grip.addEventListener('pointerdown', function (e) { e.stopPropagation(); e.preventDefault(); st = { y: e.clientY, h: r.h || 260, id: e.pointerId }; grip.setPointerCapture(e.pointerId); });
    grip.addEventListener('pointermove', function (e) {
      if (!st) return;
      var k = 1000 / surfW(s);
      r.h = clamp(st.h + (e.clientY - st.y) * k, 80, 3000);
      s.ratio = r.h / 1000; s.el.style.height = Math.round(surfW(s) * s.ratio) + 'px'; redrawInk(s);
    });
    grip.addEventListener('pointerup', function () { if (st) { st = null; saveCornell(); } });
  }
  function toggleBlind(row, r) {
    var was = row.classList.contains('blinded');
    row.classList.toggle('blinded', !was);
    if (was && S.study) row.classList.add('judging');
    else row.classList.remove('judging');
  }
  function blindAll(on) { Array.prototype.forEach.call(document.querySelectorAll('.crow'), function (row) { row.classList.toggle('blinded', on); row.classList.remove('judging'); }); }
  function setStudy(on) {
    S.study = on;
    document.body.classList.toggle('study', on);
    Array.prototype.forEach.call(document.querySelectorAll('.cue'), function (c) { c.contentEditable = on ? 'false' : 'true'; });
    blindAll(on);
    buildBars();
    toast(on ? '암기 모드: 키워드를 탭하면 필기가 가려지거나 드러나요' : '편집 모드');
  }
  function addRow() {
    var r = { id: uid(), cue: '', text: '', h: 260 };
    S.cornell.rows.push(r);
    var e = rowEl(r, '');
    $('.c-rows').appendChild(e);
    layout(); renderSurf(S.surfs['r_' + r.id], true);
    saveCornell();
    setTimeout(function () { e.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 30);
  }
  function deleteRow(r, row) {
    modal('<h3>이 행을 삭제할까요?</h3><p>키워드와 필기가 함께 지워져요.</p><div class="acts"><button id="mcancel">취소</button><button class="pri" id="mok" style="background:#E5484D">삭제</button></div>');
    $('#mcancel').onclick = closeModal;
    $('#mok').onclick = function () { closeModal(); reallyDeleteRow(r, row); };
  }
  function reallyDeleteRow(r, row) {
    S.cornell.rows = S.cornell.rows.filter(function (x) { return x !== r; });
    var k = 'r_' + r.id; io.unobserve(S.surfs[k].el); delete S.surfs[k]; S.order = S.order.filter(function (x) { return x !== k; });
    row.remove(); saveCornell();
    post({ type: 'saveInk', key: k, data: '' });
  }
  function surfImage(s) {
    if (!s || !s.strokes.length) return null;
    var w = surfW(s), h = w * s.ratio, scale = Math.min(1.5, 900 / w);
    var c = document.createElement('canvas'); c.width = Math.round(w * scale); c.height = Math.round(h * scale);
    var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    // 획이 있는 범위만 잘라내기
    var bb = [Infinity, Infinity, -Infinity, -Infinity];
    s.strokes.forEach(function (st) { var b = bbox(st); bb[0] = Math.min(bb[0], b[0]); bb[1] = Math.min(bb[1], b[1]); bb[2] = Math.max(bb[2], b[2]); bb[3] = Math.max(bb[3], b[3]); });
    var k = c.width / 1000;
    s.strokes.forEach(function (st) { if (st.t === 'hl') drawStroke(ctx, st, k); });
    s.strokes.forEach(function (st) { if (st.t !== 'hl') drawStroke(ctx, st, k); });
    var pad = 20, x0 = Math.max(0, (bb[0] - pad) * k), y0 = Math.max(0, (bb[1] - pad) * k);
    var x1 = Math.min(c.width, (bb[2] + pad) * k), y1 = Math.min(c.height, (bb[3] + pad) * k);
    var o = document.createElement('canvas'); o.width = Math.max(10, x1 - x0); o.height = Math.max(10, y1 - y0);
    var oc = o.getContext('2d'); oc.fillStyle = '#fff'; oc.fillRect(0, 0, o.width, o.height);
    oc.drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
    return o.toDataURL('image/jpeg', 0.8);
  }
  function exportRow(r) {
    if (!r.cue) { toast('키워드를 먼저 적어주세요'); return; }
    post({ type: 'createCard', text: null, front: r.cue, back: r.text || '', backImg: surfImage(S.surfs['r_' + r.id]) });
  }
  function exportAllRows() {
    var cards = S.cornell.rows.filter(function (r) { return r.cue; }).map(function (r) {
      return { front: r.cue, back: r.text || '', backImg: surfImage(S.surfs['r_' + r.id]) };
    });
    if (!cards.length) { toast('키워드가 적힌 행이 없어요'); return; }
    post({ type: 'createCards', cards: cards });
  }

  /* 마인드맵 */
  var BRANCH = ['#3E63DD', '#E5484D', '#30A46C', '#F76B15', '#8E4EC6', '#12A594', '#D6409F'];
  function walk(n, f) { f(n); (n.children || []).forEach(function (c) { walk(c, f); }); }
  function findParent(n, id) { for (var i = 0; i < (n.children || []).length; i++) { var c = n.children[i]; if (c.id === id) return n; var p = findParent(c, id); if (p) return p; } return null; }
  function renderMM() {
    var box = $('.mm-scroll'); if (!box) return;
    box.innerHTML = '';
    box.appendChild(mmNode(S.cornell.summary, 0, '#3E63DD'));
  }
  function mmNode(n, depth, color) {
    n.children = n.children || [];
    var e = el('div', 'mm-node' + (depth === 0 ? ' root' : '') + (n.children.length ? ' has-kids' : '') + (n.collapsed ? ' collapsed' : ''));
    e.style.setProperty('--c', color);
    var b = el('div', 'mm-box');
    if (n.children.length) {
      var tg = el('button', '', n.collapsed ? '▸' : '▾');
      tg.onclick = function () { n.collapsed = !n.collapsed; renderMM(); saveCornell(); };
      b.appendChild(tg);
    }
    var tx = el('span', 'mm-text'); tx.contentEditable = 'true'; tx.innerText = n.text || '';
    tx.addEventListener('input', function () { n.text = tx.innerText.trim(); saveCornell(); });
    b.appendChild(tx);
    var add = el('button', '', '＋'); add.title = '하위 추가';
    add.onclick = function () { n.children.push({ id: uid(), text: '', children: [], collapsed: false }); n.collapsed = false; renderMM(); saveCornell(); focusLast(n); };
    b.appendChild(add);
    if (depth > 0) {
      var del = el('button', '', '×');
      del.onclick = function () { var p = findParent(S.cornell.summary, n.id); if (p) { p.children = p.children.filter(function (c) { return c !== n; }); renderMM(); saveCornell(); } };
      b.appendChild(del);
    }
    e.appendChild(b);
    var kids = el('div', 'mm-children');
    n.children.forEach(function (c, i) { kids.appendChild(mmNode(c, depth + 1, depth === 0 ? BRANCH[i % BRANCH.length] : color)); });
    e.appendChild(kids);
    return e;
  }
  function focusLast(n) {
    setTimeout(function () {
      var all = document.querySelectorAll('.mm-text'); var t = all[all.length - 1];
      // 방금 추가한 노드 찾기: 내용이 빈 마지막 노드
      for (var i = all.length - 1; i >= 0; i--) if (!all[i].innerText.trim()) { t = all[i]; break; }
      if (t) t.focus();
    }, 30);
  }

  /* ═════════════════ PDF 불러오기 ═════════════════ */
  var pdfjsReady = null;
  function loadPdfjs() {
    if (pdfjsReady) return pdfjsReady;
    var base = new URL('.', document.baseURI).href;
    pdfjsReady = import(base + 'pdf.min.mjs').then(function (lib) {
      var workerUrl = base + 'pdf.worker.min.mjs';
      var same = false;
      try { same = new URL(base).origin === self.origin; } catch (e) {}
      if (same || typeof Worker === 'undefined') lib.GlobalWorkerOptions.workerSrc = workerUrl;
      else {
        // 웹 버전(iframe): 다른 출처의 워커는 바로 못 띄우므로 같은 출처 blob 워커가 CDN 모듈을 불러오게 함
        try {
          var blob = new Blob(['import "' + workerUrl + '";'], { type: 'text/javascript' });
          lib.GlobalWorkerOptions.workerPort = new Worker(URL.createObjectURL(blob), { type: 'module' });
        } catch (e) { lib.GlobalWorkerOptions.workerSrc = workerUrl; }
      }
      window.pdfjsLib = lib;
      return lib;
    });
    return pdfjsReady;
  }
  function b64ToBytes(parts) {
    var bin = atob(parts.join(''));
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function openPdf(bytes) {
    return loadPdfjs().then(function (lib) {
      var root = new URL('../../', document.baseURI).href;
      return lib.getDocument({ data: bytes, cMapUrl: root + 'cmaps/', cMapPacked: true, standardFontDataUrl: root + 'standard_fonts/', wasmUrl: root + 'wasm/', isEvalSupported: false }).promise;
    });
  }
  function setLoading(text, frac) {
    var l = $('#loading');
    if (text === null) { l.style.display = 'none'; return; }
    l.style.display = 'flex'; $('#loadingText').textContent = text;
    if (frac !== undefined) $('#loadingBar').style.width = Math.round(frac * 100) + '%';
  }

  /* ═════════════════ RN → 엔진 ═════════════════ */
  var initData = null;
  function receive(msg) {
    if (typeof msg === 'string') msg = JSON.parse(msg);
    if (msg.type === 'init') return init(msg);
    if (msg.type === 'chunk') {
      var arr = S.chunks[msg.key] = S.chunks[msg.key] || [];
      arr.push(msg.data);
      if (msg.key === 'main') setLoading('PDF 불러오는 중…', msg.n ? (msg.i + 1) / msg.n : undefined);
      if (msg.last) {
        var bytes = b64ToBytes(arr); S.chunks[msg.key] = [];
        if (msg.key === 'main') {
          openPdf(bytes).then(function (pdf) {
            S.pdf = pdf;
            return buildPdfPages(pdf, initData.ink || {});
          }).then(function () {
            setLoading(null);
            jumpTo(initData.lastPage);
          }).catch(function (e) { setLoading('PDF를 열 수 없어요: ' + e.message); post({ type: 'error', message: String(e && e.message || e) }); });
        } else {
          openPdf(bytes).then(function (pdf) {
            S.src = pdf;
            if (msg.srcStart) S.srcStart = msg.srcStart;
            S.order.forEach(function (k) { S.surfs[k].overlayFor = null; });
            if (S.pendingCompare || S.compare) { S.pendingCompare = false; S.compare = false; setCompare(true); }
            else toast('원본이 연결됐어요 · 「원본 대조」를 눌러보세요');
          }).catch(function (e) { toast('원본 PDF를 열 수 없어요'); });
        }
      }
      return;
    }
    if (msg.type === 'toast') return toast(msg.text);
    if (msg.type === 'flush') return flushNow();
  }
  function flushNow() {
    Object.keys(dirty).forEach(function (k) { var s = S.surfs[k]; if (s) post({ type: 'saveInk', key: k, data: encodeStrokes(s.strokes) }); });
    dirty = {};
    if (S.mode === 'cornell' && S.cornell) post({ type: 'saveDoc', patch: { content: cornellData() } });
  }
  function jumpTo(n) {
    var s = S.surfs['p' + n];
    if (s && n > 1) vp.scrollTop = s.el.offsetTop - 8;
    updatePageInd();
  }
  function init(d) {
    initData = d;
    S.mode = d.mode; S.fileId = d.fileId; S.title = d.title || ''; S.template = d.template || 'blank';
    S.penOnly = d.penOnly !== false;
    if (d.prefs) { if (d.prefs.color) S.color = d.prefs.color; if (d.prefs.penW !== undefined) S.penW = d.prefs.penW; }
    document.body.classList.toggle('dark', !!d.dark);
    var c = d.content || {};
    if (d.mode === 'recall') { S.srcMap = c.srcMap || {}; S.srcStart = d.srcStart || 1; }
    buildBars();
    measureBars();
    if (d.mode === 'pdf') { setLoading('PDF 불러오는 중…', 0); loadPdfjs(); }
    else {
      if (d.mode === 'cornell') buildCornell(c, d.ink || {});
      else buildBlankPages(Math.max(1, d.pageCount || 1), d.ink || {});
      setLoading(null);
      if (d.mode !== 'cornell') jumpTo(d.lastPage || 1);
      if (d.mode === 'recall' && d.hasSource) loadPdfjs();
    }
  }
  window.addEventListener('resize', debounce(function () { measureBars(); layout(); rerenderSoon(); }, 150));

  window.Engine = { receive: receive, state: S, _encode: encodeStrokes, _decode: decodeStrokes };
  post({ type: 'ready' });
})();
</script>
</body>
</html>
